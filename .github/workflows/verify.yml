name: Verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: geek_monitor_status_stream
          POSTGRES_USER: geek_monitor
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 55434:5432
          - 55435:5432
          - 55436:5432
          - 55437:5432
          - 55438:5432
          - 55439:5432
          - 55440:5432
          - 55441:5432
          - 55442:5432
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U geek_monitor -d geek_monitor_status_stream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: admin-flutter
        run: flutter pub get

      - name: Analyze and test Flutter admin
        working-directory: admin-flutter
        run: |
          flutter analyze
          flutter test

      - name: Run backend tests and build Flutter Web
        run: ./gradlew test --no-daemon --console=plain

      - name: Package isolated SSE acceptance application
        run: ./gradlew quarkusBuild --no-daemon --console=plain

      - name: Install PostgreSQL client for isolated database acceptance
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi

      - name: Verify packaged Flutter first-install and login in Chromium
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:55435/geek_monitor_browser_install
          DB_USERNAME: geek_monitor
          DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          GEEK_MONITOR_SECURITY_SECURE_COOKIE: 'false'
          QUARKUS_HTTP_PORT: '18090'
          QUARKUS_MAILER_MOCK: 'true'
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55435 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_browser_install

          browser_venv="$RUNNER_TEMP/geek-monitor-browser-e2e"
          python3 -m venv "$browser_venv"
          "$browser_venv/bin/pip" install --requirement scripts/requirements-browser-e2e.txt
          "$browser_venv/bin/python" -m playwright install --with-deps chromium

          export GEEK_MONITOR_ENCRYPTION_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          app_log="$RUNNER_TEMP/geek-monitor-browser-install.log"
          java -Xms128m -Xmx768m -jar build/quarkus-app/quarkus-run.jar >"$app_log" 2>&1 &
          app_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            if [[ "$status" -ne 0 ]]; then
              tail -n 120 "$app_log"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 120 "$app_log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18090/q/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            tail -n 120 "$app_log"
            exit 1
          fi

          "$browser_venv/bin/python" scripts/e2e-admin-install-browser.py \
            --base-url http://127.0.0.1:18090

      - name: Verify trusted Agent CPU and disk threshold lifecycle
        env:
          GEEK_MONITOR_E2E_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55442 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_metric_threshold
          python3 scripts/e2e-agent-metric-threshold.py

      - name: Verify V1 to V27 telemetry partition migration
        env:
          GEEK_MONITOR_E2E_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55440 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_partition_test
          python3 scripts/e2e-time-partition-migration.py

      - name: Verify rollup failure preserves raw telemetry
        env:
          GEEK_MONITOR_E2E_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55438 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_retention_atomicity
          python3 scripts/e2e-retention-atomicity.py

      - name: Verify history reads across raw and rollup resolutions
        env:
          GEEK_MONITOR_E2E_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55439 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_metric_resolution
          python3 scripts/e2e-metric-resolution-query.py

      - name: Verify notification grouping, rate limits, and burst dispatch
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:55434/geek_monitor_notification_storm
          DB_USERNAME: geek_monitor
          DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          GEEK_MONITOR_NETWORK_ALLOW_PRIVATE_TARGETS: 'true'
          GEEK_MONITOR_SECURITY_SECURE_COOKIE: 'false'
          QUARKUS_HTTP_HOST: 127.0.0.1
          QUARKUS_HTTP_PORT: '18086'
          QUARKUS_MAILER_MOCK: 'true'
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55434 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_notification_storm

          export GEEK_MONITOR_ENCRYPTION_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          app_log="$RUNNER_TEMP/geek-monitor-notification-rate-limit.log"
          java -Xms128m -Xmx768m -jar build/quarkus-app/quarkus-run.jar >"$app_log" 2>&1 &
          app_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            if [[ "$status" -ne 0 ]]; then
              tail -n 120 "$app_log"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 120 "$app_log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18086/q/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            tail -n 120 "$app_log"
            exit 1
          fi

          service_address="$(ip -4 route get 1.1.1.1 | awk '{ for (i = 1; i <= NF; i++) if ($i == "src") { print $(i + 1); exit } }')"
          python3 scripts/e2e-notification-rate-limit.py \
            --base-url http://127.0.0.1:18086 \
            --db-port 55434 \
            --sink-address "$service_address" \
            --sink-port 25291

      - name: Verify SMTP failure and outbox recovery
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:55443/geek_monitor_smtp_retry
          DB_USERNAME: geek_monitor
          DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          GEEK_MONITOR_SECURITY_SECURE_COOKIE: 'false'
          QUARKUS_HTTP_HOST: 127.0.0.1
          QUARKUS_HTTP_PORT: '18087'
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '2526'
          SMTP_FROM: geek-monitor-test@localhost
          SMTP_START_TLS: DISABLED
          SMTP_MOCK: 'false'
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55443 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_smtp_retry

          export GEEK_MONITOR_ENCRYPTION_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          app_log="$RUNNER_TEMP/geek-monitor-smtp-retry.log"
          java -Xms128m -Xmx768m -jar build/quarkus-app/quarkus-run.jar >"$app_log" 2>&1 &
          app_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            if [[ "$status" -ne 0 ]]; then
              tail -n 120 "$app_log"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 120 "$app_log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18087/q/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            tail -n 120 "$app_log"
            exit 1
          fi

          python3 scripts/e2e-notification-smtp-retry.py \
            --base-url http://127.0.0.1:18087 \
            --smtp-port 2526 \
            --first-failure-timeout 35 \
            --retry-timeout 60

      - name: Verify Webhook failure and outbox recovery
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:55441/geek_monitor_webhook_retry
          DB_USERNAME: geek_monitor
          DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          GEEK_MONITOR_NETWORK_ALLOW_PRIVATE_TARGETS: 'true'
          GEEK_MONITOR_SECURITY_SECURE_COOKIE: 'false'
          QUARKUS_HTTP_HOST: 127.0.0.1
          QUARKUS_HTTP_PORT: '18089'
          QUARKUS_MAILER_MOCK: 'true'
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55441 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_webhook_retry

          export GEEK_MONITOR_ENCRYPTION_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          app_log="$RUNNER_TEMP/geek-monitor-webhook-retry.log"
          java -Xms128m -Xmx768m -jar build/quarkus-app/quarkus-run.jar >"$app_log" 2>&1 &
          app_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            if [[ "$status" -ne 0 ]]; then
              tail -n 120 "$app_log"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 120 "$app_log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18089/q/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            tail -n 120 "$app_log"
            exit 1
          fi

          service_address="$(ip -4 route get 1.1.1.1 | awk '{ for (i = 1; i <= NF; i++) if ($i == "src") { print $(i + 1); exit } }')"
          python3 scripts/e2e-notification-webhook-retry.py \
            --base-url http://127.0.0.1:18089 \
            --sink-address "$service_address" \
            --sink-port 2527 \
            --first-failure-timeout 35 \
            --retry-timeout 60

      - name: Verify SSE authentication, project isolation, and replay on V27
        env:
          QUARKUS_PROFILE: dev
          QUARKUS_HTTP_PORT: '18088'
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://127.0.0.1:55435/geek_monitor_status_stream
          QUARKUS_DATASOURCE_USERNAME: geek_monitor
          QUARKUS_DATASOURCE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          GEEK_MONITOR_SECURITY_SECURE_COOKIE: 'false'
          QUARKUS_MAILER_MOCK: 'true'
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export GEEK_MONITOR_ENCRYPTION_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          java -Xms128m -Xmx768m -jar build/quarkus-app/quarkus-run.jar \
            >"$RUNNER_TEMP/geek-monitor-status-stream.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/geek-monitor-status-stream.log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18088/q/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            tail -n 100 "$RUNNER_TEMP/geek-monitor-status-stream.log"
            exit 1
          fi

          python3 scripts/e2e-status-event-stream.py --base-url http://127.0.0.1:18088

      - name: Verify scheduler, incident, notification, and maintenance lifecycle on V27
        env:
          QUARKUS_PROFILE: dev
          QUARKUS_HTTP_PORT: '18089'
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://127.0.0.1:55435/geek_monitor_incident_lifecycle
          QUARKUS_DATASOURCE_USERNAME: geek_monitor
          QUARKUS_DATASOURCE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          GEEK_MONITOR_SECURITY_SECURE_COOKIE: 'false'
          QUARKUS_MAILER_MOCK: 'true'
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55435 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_incident_lifecycle
          export GEEK_MONITOR_ENCRYPTION_KEY="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          java -Xms128m -Xmx768m -jar build/quarkus-app/quarkus-run.jar \
            >"$RUNNER_TEMP/geek-monitor-incident-lifecycle.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 120); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/geek-monitor-incident-lifecycle.log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18089/q/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            tail -n 100 "$RUNNER_TEMP/geek-monitor-incident-lifecycle.log"
            exit 1
          fi

          service_address="$(ip -4 route get 1.1.1.1 | awk '{ for (i = 1; i <= NF; i++) if ($i == "src") { print $(i + 1); exit } }')"
          python3 scripts/e2e-monitor-incident-lifecycle.py \
            --base-url http://127.0.0.1:18089 \
            --service-address "$service_address"

      - name: Verify interrupted execution and notification recovery after restart
        env:
          GEEK_MONITOR_E2E_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          createdb --host 127.0.0.1 --port 55437 --username geek_monitor \
            --maintenance-db geek_monitor_status_stream geek_monitor_restart_recovery
          service_address="$(ip -4 route get 1.1.1.1 | awk '{ for (i = 1; i <= NF; i++) if ($i == "src") { print $(i + 1); exit } }')"
          python3 scripts/e2e-startup-recovery.py --service-address "$service_address"

      - name: Install Podman for isolated Agent heartbeat acceptance
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman
          podman info --format '{{.Host.NetworkBackend}}'

      - name: Build application image for Agent heartbeat acceptance
        run: podman build -f src/main/docker/Dockerfile.jvm -t geek-monitor-acceptance:ci .

      - name: Verify PostgreSQL storage exhaustion and recovery
        run: python3 scripts/e2e-database-space-pressure.py --app-image geek-monitor-acceptance:ci

      - name: Verify first install and heartbeat failure/recovery lifecycle
        run: python3 scripts/e2e-heartbeat-lifecycle.py --app-image geek-monitor-acceptance:ci

      - name: Verify PostgreSQL outage recovery and Redis metric collection
        run: python3 scripts/e2e-database-outage.py --app-image geek-monitor-acceptance:ci

      - name: Test persistent soak observer
        run: python3 scripts/test_monitor_agent_soak.py

      - name: Test 24-hour Agent cadence verifier
        run: python3 scripts/test_monitor_agent_cadence.py

      - name: Validate integration script syntax
        run: python3 -m py_compile scripts/e2e-*.py scripts/fixtures/*.py scripts/verify-agent-cadence.py

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Validate Agent release workflow and installer syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 .github/workflows/release-agent.yml
          bash -n scripts/install-agent.sh

      - name: Run Agent tests with race detector
        working-directory: agent
        run: go test -race -count=1 ./...
