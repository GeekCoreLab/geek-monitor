quarkus.http.port=8080
quarkus.http.limits.max-body-size=1M

# The packaged Flutter console and API share one origin; CORS is only needed by
# the separate local Flutter dev server.
quarkus.http.cors.enabled=false
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080,http://127.0.0.1:8081
%dev.quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type
%dev.quarkus.http.cors.access-control-allow-credentials=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:geek_monitor}
quarkus.datasource.password=${DB_PASSWORD:geek_monitor}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/geek_monitor}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Keep build-host resolver configuration and dnsjava's SecureRandom out of the
# native image; DNS checks read nameservers from the running container instead.
quarkus.native.additional-build-args=-J-Djboss.host.name=geek-monitor,-Djboss.host.name=geek-monitor,-J-Ddnsjava.configprovider.skipinit=true,-Ddnsjava.configprovider.skipinit=true,--initialize-at-run-time=io.smallrye.common.net.HostName,--initialize-at-run-time=org.xbill.DNS.spi.DnsjavaInetAddressResolver,--initialize-at-run-time=org.xbill.DNS.Lookup,--initialize-at-run-time=org.xbill.DNS.ResolverConfig,--initialize-at-run-time=org.xbill.DNS.ExtendedResolver,--initialize-at-run-time=org.xbill.DNS.Header,--initialize-at-run-time=org.xbill.DNS.SimpleResolver,--initialize-at-run-time=org.xbill.DNS.NioUdpClient,--initialize-at-run-time=org.xbill.DNS.DefaultIoClient,--initialize-at-run-time=org.xbill.DNS.io.DefaultIoClientFactory,--initialize-at-run-time=org.xbill.DNS.config.WindowsResolverConfigProvider,--initialize-at-run-time=org.xbill.DNS.config.WindowsResolverConfigProvider$InnerWindowsResolverConfigProvider,--initialize-at-run-time=org.xbill.DNS.config.IPHlpAPI,--initialize-at-run-time=org.xbill.DNS.config.AndroidResolverConfigProvider,--initialize-at-run-time=android,--initialize-at-run-time=com.android,--initialize-at-run-time=dalvik.system


geek-monitor.session.days=30
geek-monitor.security.cookie-name=geek_monitor_session
geek-monitor.security.secure-cookie=true
geek-monitor.security.encryption-key=${GEEK_MONITOR_ENCRYPTION_KEY:}
geek-monitor.network.allow-private-targets=false
geek-monitor.network.allowed-cidrs=${MONITOR_ALLOWED_CIDRS:none}

# Configure production SMTP through SMTP_HOST/SMTP_PORT/SMTP_USERNAME/SMTP_PASSWORD/SMTP_FROM.
quarkus.mailer.host=${SMTP_HOST:smtp.example.invalid}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.from=${SMTP_FROM:}
quarkus.mailer.start-tls=${SMTP_START_TLS:REQUIRED}
quarkus.mailer.mock=${SMTP_MOCK:false}

# Convenience values shown on the first-run screen in dev mode only.
%dev.geek-monitor.bootstrap.username=admin@biliwind.com
%dev.geek-monitor.bootstrap.password=admin@biliwind.com
%dev.geek-monitor.security.secure-cookie=false
%dev.geek-monitor.security.encryption-key=Z2Vlay1tb25pdG9yLWRldi1zZWNyZXQtMzItYnl0ZXM=
%dev.geek-monitor.network.allow-private-targets=true
%dev.quarkus.mailer.mock=true
%dev.geek-monitor.retention.interval=5s

quarkus.http.static-resources.index-page=index.html
