services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geek_monitor}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - geek_monitor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    image: ${GEEK_MONITOR_IMAGE:-geek-monitor:local}
    build:
      context: .
      dockerfile: ${GEEK_MONITOR_DOCKERFILE:-src/main/docker/Dockerfile.jvm}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GEEK_MONITOR_BIND:-127.0.0.1}:${GEEK_MONITOR_HOST_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-geek_monitor}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GEEK_MONITOR_ENCRYPTION_KEY: ${GEEK_MONITOR_ENCRYPTION_KEY:?Set GEEK_MONITOR_ENCRYPTION_KEY in .env}
      GEEK_MONITOR_SECURITY_SECURE_COOKIE: ${GEEK_MONITOR_SECURE_COOKIE:-false}
      MONITOR_ALLOWED_CIDRS: ${MONITOR_ALLOWED_CIDRS:-none}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.invalid}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-REQUIRED}
      SMTP_MOCK: "false"

volumes:
  geek_monitor_postgres:
